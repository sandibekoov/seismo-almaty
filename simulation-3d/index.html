<script>
const $=id=>document.getElementById(id);
if(typeof THREE==='undefined'){$('fallback').style.display='block';Seismo3DLanguage.init();throw new Error('Three.js unavailable')}

addEventListener('resize',size);

box(18,.2,16,mat(0x34485a),0,-.1,0);
const slab=mat(0x8aa0b3);
[.075,1.675,3.275,4.875].forEach(y=>box(5,.15,4,slab,0,y,0));
[[-2.4,-1.9],[2.4,-1.9],[-2.4,1.9],[2.4,1.9]].forEach(p=>box(.12,4.8,.12,mat(0x5d7488),p[0],2.4,p[1]));

box(.95,4.8,.95,mat(0xffffff,{transparent:true,opacity:.14,depthWrite:false}),1.7,2.4,0);

const pipeM=mat(0xe0a526,{metalness:.4});cylX(5,.09,pipeM,-4,.5,1);
const valveM=mat(0x1fae6a);ball(.22,valveM,-4,.5,1);

box(1,1,1,mat(0x6b7a88),5.2,.5,-1.2);
const cableM=mat(0x2aa3ff,{emissive:0x2aa3ff,emissiveIntensity:1});cylX(2,.05,cableM,3.7,.5,-1.2);
box(.5,.8,.15,mat(0x4a5663),2.6,1,-1.2);
const lever=box(.06,.3,.06,mat(0xd4352b),2.6,1,-1.1);
const dome=ball(.3,mat(0xff2d2d,{emissive:0xff0000,emissiveIntensity:0}),0,5.25,0);
const sl=new THREE.PointLight(0xff2020,0,8);sl.position.set(0,5.3,0);world.add(sl);
box(.9,.06,.5,mat(0x15171a),-.3,.2,1.5);
box(.25,.08,.25,mat(0x333a44),-.3,.27,1.5);
box(.18,.05,.14,mat(0x1f6feb),.05,.26,1.5);
const ledM=mat(0x00ff88,{emissive:0x00ff88,emissiveIntensity:1});ball(.04,ledM,-.65,.26,1.5);
const wm=new THREE.LineBasicMaterial({color:0x8fb4d6,transparent:true,opacity:.6});
[[-1.2,1.1,-.8],[-4,.5,1],[1.7,.8,0],[2.6,1,-1.2],[0,5,0]].forEach(p=>{world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-.3,.3,1.5),new THREE.Vector3(...p)]),wm))});
let drag=false,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',()=>drag=false);
cv.addEventListener('pointermove',e=>{if(!drag)return;tg[0]-=(e.clientX-lx)*.008;tg[1]=Math.max(.05,Math.min(1.3,tg[1]+(e.clientY-ly)*.006));cur[0]=tg[0];cur[1]=tg[1];lx=e.clientX;ly=e.clientY});
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{tg=[...V[b.dataset.v]]});
const P={m:6.5,d:8,th:.3,cf:.4,fl:true};
const peak=()=>Math.min(1.2,.015*Math.pow(10,(P.m-3)*.5));
function sync(){$('mv').textContent=P.m.toFixed(1);$('dv').textContent=P.d;$('tv').textContent=P.th.toFixed(2);$('fv').textContent=P.cf.toFixed(1);const p=peak();$('pk').textContent='Demo peak '+p.toFixed(2)+' g: '+(p*.75>P.th?'likely above threshold':'likely below threshold')}
['m','d','th','cf'].forEach(k=>$(k).oninput=()=>{P[k]=+$(k).value;sync()});
$('fl').onchange=()=>{P.fl=$('fl').checked};
function setP(k,v){P[k]=v;$(k).value=v;sync()}
sync();
const logs=[];
function log(t){const d=new Date();logs.unshift(d.toTimeString().slice(0,8)+'  '+t);if(logs.length>30)logs.pop();$('log').innerHTML=logs.join('<br>')}
function chip(id,ok,txt){const c=$('c-'+id);c.classList.toggle('off',!ok);c.querySelector('b').textContent=txt}
function cap(t){const c=$('cap');c.textContent=t;c.style.display=t?'block':'none'}
$('se').onclick=()=>{const s=$('set');s.style.display=s.style.display==='block'?'none':'block'};
let st='idle',ev=null,cnt=0,prot=false,acc=.01,liftY=2.2,last=0,T=0,demo=null,trT=0;
const sw={power:true,gas:true,lift:true,siren:false},floors=[.6,2.2,3.8],buf=new Array(160).fill(0);
function start(type){if(st!=='idle'||liveMode)return;st='run';cnt=0;ev={type,t0:T,dur:type==='step'?.25:P.d,pk:type==='step'?.55:peak(),hit:false};
log(type==='step'?'Test: footsteps / short impact':'Earthquake started, M'+P.m.toFixed(1));$('rt').textContent='Vibration detected';$('go').disabled=true;$('st').disabled=true}
function trigger(e){prot=true;trT=T;Object.assign(sw,{power:false,gas:false,lift:false,siren:true});
liftY=floors.reduce((a,b)=>Math.abs(b-cabin.position.y)<Math.abs(a-cabin.position.y)?b:a);
$('rt').textContent='Protection active in '+e.toFixed(1)+' s';
log('Quake confirmed. Reaction '+e.toFixed(1)+' s');log('Power disconnected');log('Gas valve closed');log('Elevator sent to nearest floor');log('Alarm on, app notified');
chip('esp',false,'TRIGGERED');chip('power',false,'CUT');chip('gas',false,'CLOSED');chip('lift',false,'STOPPED');chip('siren',false,'ALARM')}
function reset(){st='idle';ev=null;prot=false;cnt=0;demo=null;cap('');buf.fill(0);Object.assign(sw,{power:true,gas:true,lift:true,siren:false});
world.position.set(0,0,0);world.rotation.z=0;acc=.01;$('go').disabled=false;$('st').disabled=false;$('au').disabled=false;$('rt').textContent='Monitoring';
chip('esp',true,'ARMED');chip('power',true,'ON');chip('gas',true,'OPEN');chip('lift',true,'MOVING');chip('siren',true,'OFF');log('System reset')}
$('go').onclick=()=>start('quake');$('st').onclick=()=>start('step');$('rs').onclick=()=>{reset();tg=[...V.overview]};
const steps=[[0,()=>{setP('m',6.5);setP('d',8);setP('th',.3);setP('cf',.4);$('fl').checked=true;P.fl=true;tg=[...V.overview];cap('Normal operation: sensor monitors vibration')}],
[3,()=>{tg=[...V.esp];cap('ESP32 reads the accelerometer and checks the threshold')}],
[6.5,()=>{tg=[...V.overview];start('step');cap('Footsteps: short spike is filtered, no false alarm')}],
[10,()=>{start('quake');cap('Magnitude 6.5 earthquake')}],
[11.5,()=>{tg=[...V.power];cap('Power disconnected')}],
[14,()=>{tg=[...V.gas];cap('Gas valve closed')}],
[17,()=>{tg=[...V.lift];cap('Elevator stops at the nearest floor')}],
[20,()=>{tg=[...V.siren];cap('Alarm active, dashboard and app notified')}],
[25,()=>{tg=[...V.overview];cap('SEISMO: the system acts, not just warns')}],
[30,()=>{demo=null;cap('');$('au').disabled=false}]];
$('au').onclick=()=>{if(liveMode)return;reset();demo={t:0,i:0};$('au').disabled=true};
let liveMode=false,lastLive=0,liveFrame=null,liveStatus='';
function updateLiveUI(status){
  if(liveStatus===status)return;
  liveStatus=status;
  $('rt').textContent=status;
  if(!liveFrame || performance.now()-lastLive>2000){
    ['esp','power','gas','lift','siren'].forEach(id=>chip(id,false,'UNKNOWN'));
    $('acc').textContent='—';
  }
}
function applyTelemetry(frame){
  if(!liveMode)return;
  liveFrame=frame;lastLive=performance.now();acc=frame.accelerationG;buf.push(acc);buf.shift();draw();
  prot=frame.state==='EMERGENCY'||frame.state==='FAULT';
  Object.assign(sw,{power:frame.powerOn,gas:frame.gasOpen,lift:frame.liftMoving,siren:frame.alarmOn});
  liftY=floors[frame.floor-1];
  chip('esp',!prot,frame.state);
  chip('power',sw.power,sw.power?'ON':'CUT');
  chip('gas',sw.gas,sw.gas?'OPEN':'CLOSED');
  chip('lift',sw.lift,sw.lift?'MOVING':'STOPPED');
  chip('siren',!sw.siren,sw.siren?'ALARM':'OFF');
  updateLiveUI('Live telemetry');
}
const link=new SeismoSerial(applyTelemetry, status=>{if(liveMode){if(status==='Disconnected'||status==='Connection failed'){liveFrame=null;$('disconnect').hidden=true}updateLiveUI(status)}});
$('mode-live').onclick=()=>{if(liveMode)return;reset();liveMode=true;liveFrame=null;lastLive=0;
  $('mode-live').classList.add('active');$('mode-sim').classList.remove('active');$('connect').hidden=false;$('baud').hidden=false;
  ['go','st','au','rs','se'].forEach(id=>$(id).disabled=true);$('set').style.display='none';$('notice').dataset.t='Live notice';$('notice').textContent='Live notice';liveStatus='';draw();updateLiveUI('Waiting for ESP32')};
$('mode-sim').onclick=async()=>{if(!liveMode)return;liveMode=false;await link.disconnect();liveFrame=null;
  $('mode-live').classList.remove('active');$('mode-sim').classList.add('active');$('connect').hidden=true;$('disconnect').hidden=true;$('baud').hidden=true;
  $('rs').disabled=false;$('se').disabled=false;$('notice').dataset.t='Demo notice';$('notice').textContent='Demo notice';reset()};
$('connect').onclick=async()=>{if(!liveMode)return;$('connect').disabled=true;await link.connect(+$('baud').value);$('connect').disabled=false;$('disconnect').hidden=!link.connected()};
$('disconnect').onclick=async()=>{await link.disconnect();liveFrame=null;updateLiveUI('Disconnected');$('disconnect').hidden=true};
function draw(){const c=$('ch'),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);const sc=h/1.2;
x.strokeStyle='rgba(128,128,128,.35)';x.strokeRect(.5,.5,w-1,h-1);
if(!liveMode){x.strokeStyle='#ff5a4d';x.setLineDash([4,3]);x.beginPath();x.moveTo(0,h-P.th*sc);x.lineTo(w,h-P.th*sc);x.stroke();x.setLineDash([])}
x.strokeStyle='#35c27d';x.lineWidth=1.5;x.beginPath();buf.forEach((v,i)=>{const px=i/(buf.length-1)*w,py=h-Math.min(1.2,v)*sc;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.lineWidth=1}
function loop(ms){requestAnimationFrame(loop);const t=ms/1000,dt=Math.min(.05,t-last);last=t;T=t;
for(let i=0;i<6;i++)cur[i]+=(tg[i]-cur[i])*.07;place();
if(demo){demo.t+=dt;while(demo&&demo.i<steps.length&&demo.t>=steps[demo.i][0]){steps[demo.i][1]();if(demo)demo.i++}}
let amp=0;
if(liveMode){
  world.position.set(0,0,0);world.rotation.z=0;
  if(liveFrame&&performance.now()-lastLive>2000&&link.connected()){updateLiveUI('Telemetry stale')}
  else if(liveFrame&&performance.now()-lastLive<=2000){const shake=Math.min(1.2,acc);world.position.x=Math.sin(t*46)*.08*shake;world.rotation.z=Math.sin(t*41)*.005*shake}
}else if(ev){const e=T-ev.t0;amp=ev.type==='step'?(e<.25?1:0):Math.min(1,e/.5)*(e<ev.dur-1?1:Math.max(0,ev.dur-e));
const sx=.1*ev.pk;world.position.x=Math.sin(e*46)*sx*amp;world.position.z=Math.cos(e*38)*sx*.55*amp;world.rotation.z=Math.sin(e*41)*.007*ev.pk*amp;
acc=.012*(1+Math.random())+ev.pk*amp*(.75+.25*Math.random());
if(acc>P.th)ev.hit=true;
if(!prot){if(acc>P.th)cnt+=dt;else cnt=Math.max(0,cnt-dt);const need=P.fl?P.cf:0;if(acc>P.th&&cnt>=need)trigger(e)}
if(e>ev.dur){if(!prot){$('rt').textContent=ev.hit?'Short impact filtered: no action':'Below threshold: no action';log(ev.hit?'Impact ignored by filter':'Vibration below threshold');st='idle';$('go').disabled=false;$('st').disabled=false}else st='done';ev=null}}
else{acc=.012*(1+Math.random());world.position.set(0,0,0);world.rotation.z=0}
const fresh=!liveMode||(liveFrame&&performance.now()-lastLive<=2000);
if(fresh){if(!liveMode){buf.push(acc);buf.shift();draw()}$('acc').textContent=acc.toFixed(2)+' g'}
if(fresh){
if(liveMode){cabin.position.y+=(liftY-cabin.position.y)*.06}
