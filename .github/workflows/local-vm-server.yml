name: Local VM server checks
on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/local-vm-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/local-vm-server.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m pytest -q server/tests
